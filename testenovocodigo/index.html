<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minha Jornada</title>

    <meta
        name="description"
        content="Roadmap gamificado de aulas e exercícios."
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>



<body>

    <main
        class="mapa-container"
        id="mapa-container"
    >

        <img
            src="screenshot_map_horizantal.png"
            class="mapa-imagem"
            id="mapa-imagem"
            alt="Mapa das aulas"
            draggable="false"
        >


        <!-- PERSONAGEM PRÓXIMO À CASA -->

        <img
            src="Businessman.gif"
            class="businessman"
            id="businessman"
            alt="Personagem"
            draggable="false"
        >


        <!-- AULA ZERO -->

        <button
            class="botao-aula"
            id="botao-aula-0"
            data-aula="0"
            aria-label="Abrir Aula Zero"
        ></button>


        <!-- AULA 1 -->

        <button
            class="botao-aula"
            id="botao-aula-1"
            data-aula="1"
            aria-label="Abrir Aula 1"
        ></button>


        <!-- AULA 2 -->

        <button
            class="botao-aula"
            id="botao-aula-2"
            data-aula="2"
            aria-label="Abrir Aula 2"
        ></button>


        <!-- AULA 3 -->

        <button
            class="botao-aula"
            id="botao-aula-3"
            data-aula="3"
            aria-label="Abrir Aula 3"
        ></button>


        <!-- AULA 4 -->

        <button
            class="botao-aula"
            id="botao-aula-4"
            data-aula="4"
            aria-label="Abrir Aula 4"
        ></button>


        <!-- AULA 5 -->

        <button
            class="botao-aula"
            id="botao-aula-5"
            data-aula="5"
            aria-label="Abrir Aula 5"
        ></button>


        <!-- AULA 6 -->

        <button
            class="botao-aula"
            id="botao-aula-6"
            data-aula="6"
            aria-label="Abrir Aula 6"
        ></button>


        <!-- AULA 7 -->

        <button
            class="botao-aula"
            id="botao-aula-7"
            data-aula="7"
            aria-label="Abrir Aula 7"
        ></button>


        <!-- MENU GERADO PELO JAVASCRIPT -->

        <div
            class="menu-aula"
            id="menu-aula"
        ></div>

    </main>


    <script src="script.js"></script>

</body>

</html>
